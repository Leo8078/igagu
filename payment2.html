<body>

    <br>

    <div class="progress-wrapper">
        <h2 class="signup-title">주문서 작성</h2>
        <div class="progress-bar">
            <span class="step1">01 장바구니</span>
            <span class="separator">></span>
            <span class="step2">02 주문서 작성</span>
            <span class="separator">></span>
            <span class="step3">03 주문완료</span>
        </div>
    </div>
    <hr class="progress-line">

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>상품정보</th>
                    <th>수량</th>
                    <th>할인 금액</th>
                    <th>상품 금액</th>
                    <th>배송 금액</th>
                </tr>
            </thead>
            <tbody id="cartTableBody">
                <!-- 상품 데이터가 여기에 추가됩니다 -->
            </tbody>
        </table>
    </div>
    <script>
        // 장바구니 데이터를 가져오는 함수
        function fetchCartData() {
            fetch("get_cart.php") // PHP 파일 경로
                .then(response => {
                    if (!response.ok) {
                        throw new Error("네트워크 응답에 문제가 있습니다.");
                    }
                    return response.json(); // JSON 데이터를 반환
                })
                .then(cartItems => {
                    renderCartTable(cartItems); // 테이블에 데이터를 렌더링
                })
                .catch(error => {
                    console.error("장바구니 데이터를 가져오는 중 오류 발생:", error);
                });
        }
    
        // 테이블에 데이터를 추가하는 함수
        function renderCartTable(cartItems) {
            const tableBody = document.getElementById("cartTableBody");
            tableBody.innerHTML = ""; // 기존 데이터를 초기화
    
            cartItems.forEach(item => {
                const row = document.createElement("tr");
    
                // 상품정보 열
                const productInfo = document.createElement("td");
                productInfo.textContent = `${item.name} / ${item.size}, ${item.color}`;
                row.appendChild(productInfo);
    
                // 수량 열
                const quantity = document.createElement("td");
                quantity.textContent = item.quantity;
                row.appendChild(quantity);
    
                // 할인 금액 열 (임시로 0원으로 표시)
                const discount = document.createElement("td");
                discount.textContent = "(-)0 원"; // 실제 할인 로직 추가 가능
                row.appendChild(discount);
    
                // 상품 금액 열
                const productPrice = document.createElement("td");
                productPrice.textContent = `${(item.price * item.quantity).toLocaleString()} 원`;
                row.appendChild(productPrice);
    
                // 배송 금액 열 (임시로 3,000원으로 표시)
                const shippingCost = document.createElement("td");
                shippingCost.textContent = "3,000 원"; // 실제 배송 로직 추가 가능
                row.appendChild(shippingCost);
    
                // 테이블에 행 추가
                tableBody.appendChild(row);
            });
        }
    
        // 페이지 로드 시 장바구니 데이터를 가져옴
        fetchCartData();
    </script>

    <!-- 정보입력 -->
    <div class="progress-wrapper2">

    </div>
    <hr class="progress-line2">

    <div class="signup2-input-group">
        <label for="name">상품 합계 금액</label>
        <p id="totalProductPrice">0원</p>
    </div>
    <hr class="progress-line3">
    
    <div class="signup2-input-group">
        <label for="name">배송비 합계 금액</label>
        <p id="totalShippingFee">0원</p>
    </div>
    <hr class="progress-line3">
    
    <div class="signup2-input-group">
        <label for="name">할인 및 적립</label>
        <p id="totalDiscount">0원</p>
    </div>
    <hr class="progress-line3">
    
    <div class="signup2-input-group">
        <label for="name">최종 결제 금액</label>
        <p id="finalPaymentAmount">0원</p>
    </div>
    <hr class="progress-line2">
    
    <script>
        // 장바구니 데이터를 가져오는 함수
        function fetchCartData() {
            fetch("get_cart.php") // PHP 파일 경로
                .then(response => {
                    if (!response.ok) {
                        throw new Error("네트워크 응답에 문제가 있습니다.");
                    }
                    return response.json(); // JSON 데이터를 반환
                })
                .then(cartItems => {
                    updateSummary(cartItems); // 요약 데이터를 업데이트
                })
                .catch(error => {
                    console.error("장바구니 데이터를 가져오는 중 오류 발생:", error);
                });
        }
    
        // 상품 합계, 배송비 합계, 할인 및 최종 금액 계산 및 업데이트
        function updateSummary(cartItems) {
            let totalProductPrice = 0; // 상품 합계 금액
            let totalShippingFee = 3000; // 배송비 합계 금액 (기본 3,000원)
            let totalDiscount = 0; // 할인 금액
    
            // 상품 합계 금액 계산
            cartItems.forEach(item => {
                totalProductPrice += item.price * item.quantity;
            });
    
            // 할인 금액 임의 설정 (10% 할인 예시)
            totalDiscount = Math.floor(totalProductPrice * 0.1);
    
            // 최종 결제 금액 계산
            const finalPaymentAmount = totalProductPrice + totalShippingFee - totalDiscount;
    
            // DOM에 데이터 업데이트
            document.getElementById("totalProductPrice").textContent = `${totalProductPrice.toLocaleString()}원`;
            document.getElementById("totalShippingFee").textContent = `${totalShippingFee.toLocaleString()}원`;
            document.getElementById("totalDiscount").textContent = `(-)${totalDiscount.toLocaleString()}원`;
            document.getElementById("finalPaymentAmount").textContent = `${finalPaymentAmount.toLocaleString()}원`;
        }
    
        // 페이지 로드 시 장바구니 데이터를 가져옴
        fetchCartData();
    </script>
