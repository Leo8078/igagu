<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 결과</title>
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="shopping.css">
    <link rel="stylesheet" href="header.css">
    <script src="search_results.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <style>
        .search-results {
            margin-bottom: 2em;
        }

        #search-query {
            color: rgb(224, 0, 0); /* 빨간색으로 설정 */
        }
    </style>

</head>
<body>
    <!-- 헤더 -->
    <div id="header-container"></div>

    <div class="content-wrapper">
        <!-- 메인 콘텐츠 -->
        <main class="main-content">

            <!-- 검색 결과 -->
            <section class="search-results">
                <!-- 검색어 표시 -->
                <h2>'<span id="search-query"></span>'에 대한 검색결과</h2>
            </section>

             <!-- 정렬 옵션 -->
            <section class="sorting-options">
                <span>정렬:</span>
                <button class="sort-btn" data-sort="popularity">인기상품순</button>
                <button class="sort-btn" data-sort="newest">신상품순</button>
                <button class="sort-btn" data-sort="low-price">낮은가격순</button>
                <button class="sort-btn" data-sort="high-price">높은가격순</button>
                <button class="sort-btn" data-sort="reviews">리뷰순</button>
            </section>

            <div class="product-list">
                <!-- JavaScript로 상품 데이터가 렌더링됩니다. -->
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination">
                <!-- JavaScript로 페이지 버튼이 생성됩니다. -->
            </div>
        </main>
    </div>

    <!-- 푸터 -->
    <footer>
        <div id="footer_container"></div>
        <script src="loadfooter.js"></script> 
    </footer>
    
    <script src="header.js"></script>
</body>
</html>
