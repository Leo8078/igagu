<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="mypage.css">
    <script src="mypage.js" defer></script>
    <link rel="stylesheet" href="header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="mypage">
    <!-- 헤더 -->
    <div id="header-container"></div>  
    
    <!-- 현재 위치 표시 -->
    <div class="current-location">
        <span class="step1">홈</span>
        <span class="separator">></span>
        <span class="step2">마이페이지</span>
        <span class="separator">></span>
        <span class="step3">쿠폰</span>
    </div>

    <!-- 쿠폰 타이틀 -->
    <h1 class="page-title">마이 쿠폰</h1>

    <!-- 쿠폰 내역 -->
    <div class="coupon-history">
        <h3>마이 쿠폰 목록</h3>
    </div>

    <!-- 주문 내역 테이블 (예시) -->
    <div class="coupon-table">
        <table>
            <thead>
                <tr>
                    <th>쿠폰번호</th>
                    <th>쿠폰명</th>
                    <th>쿠폰적용 상품</th>
                    <th>상품금액</th>
                    <th>쿠폰금액</th>
                    <th>쿠폰사용기간</th>
                </tr>
            </thead>
            <tbody>
                <!-- 데이터가 없으면 "보유하신 쿠폰이 없습니다." 표시 -->
                <tr>
                    <td colspan="6">보유하신 쿠폰이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>


    <!-- 쿠폰 내역 -->
    <div class="coupon-history">
        <h3>쿠폰번호 등록하기</h3>
    </div>
    <div class="coupon-registration">
        <div class="coupon-input-wrapper">
            <input type="text" id="coupon-code" placeholder="쿠폰번호를 입력하세요." />
            <button class="coupon-submit-btn">쿠폰번호 등록</button>
        </div>
        <p class="coupon-info">반드시 쇼핑몰에서 발행한 쿠폰번호만 입력해주세요. (10~35자 입력번호 *는 제외)</p>
    </div>
    <script src="header.js"></script>
</body>
</html>
