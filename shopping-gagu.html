<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 - 가구</title>
    <link rel="stylesheet" href="shopping.css">
    <link rel="stylesheet" href="header.css">
    <script src="shopping.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <!-- 헤더 -->
    <div id="header-container"></div>

    <div class="content-wrapper">
        <!-- 사이드바 -->
        <aside class="customer-side-menu">
            <h2>가구</h2>
            <hr class="progress-line2">
            <ul class="menu-list">
                <li><a href="shopping-gagu.html">가구 All</a></li>
                <li><a href="shopping-lighting.html">조명&홈데코</a></li>
                <li><a href="shopping-bathroom.html">욕실</a></li>
                <li><a href="shopping-fabric.html">홈 패브릭</a></li>
                <li><a href="shopping-storage.html">수납&정리</a></li>
                <li><a href="shopping-outdoor.html">아웃도어</a></li>
            </ul>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 광고 배너 -->
            <section class="ad-banner">
                <img src="image/spon2.jpg" alt="광고 배너 이미지" class="ad-banner-image">
            </section>

            <!-- 정렬 옵션 -->
            <section class="sorting-options">
                <span>정렬:</span>
                <button class="sort-btn" data-sort="popularity">인기상품순</button>
                <button class="sort-btn" data-sort="newest">신상품순</button>
                <button class="sort-btn" data-sort="low-price">낮은가격순</button>
                <button class="sort-btn" data-sort="high-price">높은가격순</button>
                <button class="sort-btn" data-sort="reviews">리뷰순</button>
            </section>

            <!-- 상품 리스트 -->
            <section class="product-list">
                <!-- JavaScript로 상품 데이터가 렌더링됩니다. -->
            </section>

            <!-- 페이지네이션 -->
            <div class="pagination">
                <!-- JavaScript로 페이지 버튼이 생성됩니다. -->
            </div>
        </main>
    </div>

    <!-- 푸터 -->
    <footer>
        <div id="footer_container"></div>
        <script src="loadfooter.js"></script> 
    </footer>
    <script src="header.js"></script>
</body>
</html>
