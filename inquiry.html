<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 신청</title>
    <link rel="stylesheet" href="header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: "Noto Sans KR", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            padding-top: 120px; /* 헤더 공간 확보 */
        }
        .header {
            position: fixed;
            top: 0;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #fff;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .product-category {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .product-category div {
            border: 1px solid #000;
            width: 120px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .table input[type="text"], input[type="tel"], textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .store-search {
            display: flex;
            align-items: center;
        }
        .store-search button {
            margin-left: 10px;
            padding: 5px 10px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
        }
        .checkbox-group {
            margin-top: 20px;
        }
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
        }
        
        select:focus {
            border-color: #000;
            outline: none;
        }
        
        option {
            padding: 8px;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="container">
        <div class="header-title">문의 신청</div>

        <!-- 상담 카테고리 -->
        <form id="inquiryForm" action="inquiry.php" method="POST"> <!-- 폼 데이터 제출처 -->
            <table>
                <tr>
                    <th colspan="2">상담 카테고리</th>
                </tr>
                <tr>
                    <td colspan="2">
                        <select name="category">
                            <option value="가구">가구</option>
                            <option value="인테리어">인테리어</option>
                        </select>
                    </td>
                </tr>
            </table>

            <!-- 고객 정보 입력 -->
            <table>
                <tr>
                    <th colspan="2">고객정보입력</th>
                </tr>
                <tr>
                    <td>성명</td>
                    <td><input type="tel" name="name" placeholder="정확한 상담을 위해 실명을 입력해주세요" required></td>
                </tr>
                <tr>
                    <td>연락처</td>
                    <td><input type="tel" name="contact" placeholder="연락처를 입력해주세요" required></td>
                </tr>
            </table>

            <!-- 상담내용 입력 -->
            <table>
                <tr>
                    <th colspan="2">상담내용</th>
                </tr>
                <tr>
                    <td colspan="2">
                        <textarea name="message" placeholder="상담 내용을 입력해주세요" required></textarea>
                    </td>
                </tr>
            </table>

            <!-- 개인정보 동의 -->
            <div class="checkbox-group">
                <label><input type="checkbox" id="agreeAll" onclick="toggleAll()"> 전체 동의</label>
                <br>
                <label><input type="checkbox" class="agree-checkbox"> 개인정보 수집 및 이용 동의</label>
                <br>
                <label><input type="checkbox" class="agree-checkbox"> 개인정보 제3자 제공 동의</label>
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" class="submit-btn">신청하기</button>
        </form>
    </div>

    <script>
        // 전체 동의 체크박스 기능
        function toggleAll() {
            const agreeAll = document.getElementById('agreeAll');
            const checkboxes = document.querySelectorAll('.agree-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = agreeAll.checked;
            });
        }

        // 폼 제출 시 AJAX 요청 보내기
        document.getElementById('inquiryForm').addEventListener('submit', function(event) {
            event.preventDefault();  // 폼 기본 제출 방지

            // 폼 데이터 수집
            const formData = new FormData(this);
            const data = {
                name: formData.get('name'),
                contact: formData.get('contact'),
                category: formData.get('category'),
                message: formData.get('message')
            };

            // AJAX 요청 보내기
            fetch('inquiry.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // JSON 형식으로 데이터 전송
                },
                body: JSON.stringify(data)  // JSON.stringify로 데이터를 JSON 형식으로 변환
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert("문의가 성공적으로 제출되었습니다.");
                    window.location.reload();
                    // list 페이지로 리디렉션
                    window.location.href = "inquiries-list.php";  // inquiries-list.php로 이동
                } else {
                    alert("문의 제출에 실패했습니다: " + result.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
    <script src="header.js"></script>
</body>
</html>
