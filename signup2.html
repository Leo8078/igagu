<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- 헤더 부분 -->
    <header>
        <nav>
            <a href="main.html" class="logo">!gagU</a>
        </nav>
    </header>

    <!-- 회원가입 진행 상태 -->
    <div class="progress-wrapper">
        <h2 class="signup-title">회원가입</h2>
        <div class="progress-bar">
            <span class="step1">01 약관동의</span>
            <span class="separator">></span>
            <span class="step2">02 정보입력</span>
            <span class="separator">></span>
            <span class="step3">03 가입완료</span>
        </div>
    </div>
    <hr class="progress-line">

    <!-- 정보입력 -->
    <div class="progress-wrapper2">
        <h5 class="mini-title1">정보입력</h5>
    </div>
    <hr class="progress-line2">

    <form action="signup.php" method="POST">
        <!-- 아이디 입력 -->
        <div class="signup2-input-group">
            <label for="username">아이디</label>
            <div class="username-wrapper">
                <input type="text" id="username" name="username" placeholder="아이디 입력" required>
                <button type="button" id="check-username-btn">중복 확인</button>
            </div>
            <p id="username-feedback" style="color: red; font-size: 14px;"></p>
        </div>

        <hr class="progress-line3">

        <!-- 비밀번호 입력 -->
        <div class="signup2-input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
        </div>
        <hr class="progress-line3">

        <!-- 비밀번호 확인 -->
        <div class="signup2-input-group">
            <label for="confirm-password">비밀번호 확인</label>
            <input type="password" id="confirm-password" name="password" placeholder="비밀번호 확인" required>
            <span id="password-message"></span> <!-- 비밀번호 메시지 -->
        </div>
        <hr class="progress-line3">

        <!-- 이름 -->
        <div class="signup2-input-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="이름 입력" required>
        </div>
        <hr class="progress-line3">

        <!-- 이메일 -->
        <div class="signup2-input-group">
            <label for="email">이메일</label>
            <div class="email-wrapper">
                <input type="email" id="email" name="email" placeholder="이메일 입력" required>
                <select id="email-domain">
                    <option value="">-- 직접입력 --</option>
                    <option value="naver.com">naver.com</option>
                    <option value="gmail.com">gmail.com</option>
                    <option value="daum.net">daum.net</option>
                    <!-- 추가적인 도메인 추가 가능 -->
                </select>
                <span id="email-message"></span> <!-- 이메일 메시지 -->
            </div>
            <!-- 메일 수신 동의 체크박스 -->
        </div>
        <div class="signup2-checkbox-group">
            <input type="checkbox" id="receive-info" name="receive_info">
            <label for="receive-info">정보/이벤트 메일 수신에 동의합니다.</label>
        </div>
        <hr class="progress-line3">

        <!-- 전화번호 -->
        <div class="signup2-input-group">
            <label for="phone">전화번호</label>
            <input type="tel" id="phone" name="phone" placeholder="- 없이 입력하세요." required>
            <span id="phone-message"></span> <!-- 전화번호 메시지 -->
        </div>
        <!-- 전화번호 수신 동의 체크박스 -->
        <div class="signup2-checkbox-group">
            <input type="checkbox" id="receive-events" name="receive_events">
            <label for="receive-events">이벤트 수신에 동의합니다.</label>
        </div>
        <hr class="progress-line3">

        <!-- 주소 -->
        <div class="signup2-input-group">
            <label for="address">주소</label>
            <textarea id="address" name="address" placeholder="주소 입력"></textarea>
        </div>
        <hr class="progress-line3">

    <!-- 버튼들 -->
    <div class="navigation-btns">
        <button class="prev-btn" id="prev-btn">이전 단계</button>
        <button class="signup-btn" id="signup-btn" disabled>회원가입</button>
    </div>
    
</body>
</html>
