<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디/비밀번호 찾기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 50px;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #000000;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin-bottom: 30px;
        }
        button:hover {
            background: #808080;
        }
        .link {
            margin-top: 10px;
            text-align: center;
        }
        .link a {
            text-decoration: none;
            color: #000000;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <h1>아이디/비밀번호 찾기</h1>
        <form id="find-id" action="find_id.php" method="POST">
            <label for="email">이메일로 아이디 찾기</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
            <button type="submit">아이디 찾기</button>
        </form>
        
        <form id="reset-password" action="reset_pw.php" method="POST" style="margin-top: 20px;">
            <label for="username">아이디로 비밀번호 찾기</label>
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
            <input type="email" id="reset-email" name="email" placeholder="이메일을 입력하세요" required>
            <input type="password" id="new-password" name="new_password" placeholder="새 비밀번호를 입력하세요" required>
            <button type="submit">비밀번호 변경</button>
        </form>
        <div class="link">
            <a href="login.html">로그인 페이지로 돌아가기</a>
        </div>
    </div>

</body>
</html>
