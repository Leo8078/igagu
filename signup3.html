    <title>회원가입</title>
    <link rel="stylesheet" href="signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

<body>

            <a href="main.html" class="logo">!gagU</a>
        </nav>
    </header>

    <!-- 회원가입 진행 상태 -->
    <div class="progress-wrapper">
        <h2 class="signup-title">회원가입</h2>
        <div class="progress-bar">
            <span class="step1">01 약관동의</span>
            <span class="separator">></span>
            <span class="step2">02 정보입력</span>
            <span class="separator">></span>
            <span class="step3">03 가입완료</span>

    </div>
    <hr class="progress-line">

    <div class="signup3-complete-wrapper">
        <div class="signup3-background-image"></div> 
        <div class="signup3-content">
            <h2 class="signup3-success-message">!gagU<br>가입이 완료되었습니다.<br>환영합니다!</h2>
        </div>
    </div>
    
    <br>
    <br>
    <!-- 버튼들 -->
    <div class="navigation-btns">
        <button class="home-btn" id="home-btn">메인으로</button>
    </div>
